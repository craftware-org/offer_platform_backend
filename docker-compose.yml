# Local development services only. Never use these credentials outside your machine.
# Start:  docker compose up -d      Stop:  docker compose down      Wipe data:  docker compose down -v
name: offer-platform

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: offer_platform
      POSTGRES_PASSWORD: offer_platform_dev
      POSTGRES_DB: offer_platform
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U offer_platform -d offer_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    # Valkey = open-source Redis fork, the engine offered by AWS ElastiCache (ADR-0011)
    image: valkey/valkey:8.0-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  valkey-data:
